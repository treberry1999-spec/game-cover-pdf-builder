name: Fetch Vibe cleanup covers
on:
  push:
    branches: [ main ]
    paths:
      - 'magazines/fetch_vibe_cleanup.py'
      - '.github/workflows/fetch_vibe_cleanup.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python magazines/fetch_vibe_cleanup.py
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-cleanup-covers
          path: vibe_cleanup/
          retention-days: 7
