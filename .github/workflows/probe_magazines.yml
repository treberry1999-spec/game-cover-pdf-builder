name: Probe magazine cover sources
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'magazines/probe_magazine_sources.py'
      - '.github/workflows/probe_magazines.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python magazines/probe_magazine_sources.py > probe.txt 2>&1
      - run: tail -n +1 probe.txt | head -n 1500
      - uses: actions/upload-artifact@v4
        with:
          name: magazine-probe
          path: |
            probe.txt
            source_archive.html
            xxl_covers.html
          retention-days: 3
