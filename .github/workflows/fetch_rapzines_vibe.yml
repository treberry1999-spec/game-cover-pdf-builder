name: Fetch Rapzines VIBE archive
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'magazines/fetch_rapzines_vibe.py'
      - '.github/workflows/fetch_rapzines_vibe.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 pillow
      - run: python magazines/fetch_rapzines_vibe.py
      - uses: actions/upload-artifact@v4
        with:
          name: rapzines-vibe-archive
          path: magazine_output/rapzines_vibe_archive/
          retention-days: 7
