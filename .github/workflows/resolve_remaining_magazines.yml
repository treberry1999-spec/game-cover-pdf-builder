name: Resolve remaining magazine covers
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'magazines/resolve_remaining.py'
      - '.github/workflows/resolve_remaining_magazines.yml'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 pillow
      - run: python magazines/resolve_remaining.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-magazine-covers
          path: magazine_output/remaining/
          if-no-files-found: error
          retention-days: 7
