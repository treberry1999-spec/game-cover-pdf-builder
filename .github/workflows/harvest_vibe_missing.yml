name: Harvest missing VIBE candidates
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'magazines/harvest_vibe_missing.py'
      - '.github/workflows/harvest_vibe_missing.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 pillow
      - run: python magazines/harvest_vibe_missing.py
      - uses: actions/upload-artifact@v4
        with:
          name: vibe-missing-candidates
          path: magazine_output/vibe_missing_candidates/
          retention-days: 7
