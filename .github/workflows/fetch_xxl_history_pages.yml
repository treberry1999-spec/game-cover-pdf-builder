name: Fetch XXL history pages
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'magazines/fetch_xxl_history_pages.py'
      - '.github/workflows/fetch_xxl_history_pages.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python magazines/fetch_xxl_history_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: xxl-history-pages
          path: magazine_output/xxl_history_pages/
          retention-days: 7
