name: Resolve exact magazine targets from eBay
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'magazines/resolve_ebay_targets.py'
      - '.github/workflows/resolve_ebay_targets.yml'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4 pillow
      - run: python magazines/resolve_ebay_targets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ebay-magazine-targets
          path: magazine_output/ebay_targets/
          retention-days: 7
