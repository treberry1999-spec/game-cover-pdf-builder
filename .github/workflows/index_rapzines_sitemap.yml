name: Index Rapzines sitemap
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'magazines/index_rapzines_sitemap.py'
      - '.github/workflows/index_rapzines_sitemap.yml'
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python magazines/index_rapzines_sitemap.py
      - uses: actions/upload-artifact@v4
        with:
          name: rapzines-sitemap-index
          path: magazine_output/rapzines_sitemap/
          retention-days: 7
