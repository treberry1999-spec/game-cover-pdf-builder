name: Probe XXL gallery API
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'magazines/probe_xxl_gallery.py'
      - '.github/workflows/probe_xxl_gallery.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python magazines/probe_xxl_gallery.py > xxl_gallery_probe.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: xxl-gallery-probe
          path: xxl_gallery_probe.txt
          retention-days: 3
