name: Extract BuzzFeed VIBE cover images
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'magazines/extract_buzzfeed_vibe.py'
      - '.github/workflows/extract_buzzfeed_vibe.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests beautifulsoup4
      - run: python magazines/extract_buzzfeed_vibe.py
      - uses: actions/upload-artifact@v4
        with:
          name: buzzfeed-vibe-extract
          path: magazine_output/buzzfeed/
          retention-days: 3
