name: Build game cover PDFs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: game-cover-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pillow reportlab rapidfuzz
      - name: Build PDFs
        run: python builder.py
      - name: List output
        run: ls -lh output && cat output/build_summary.json
      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: game-cover-pdfs
          path: output/
          if-no-files-found: error
          retention-days: 7
