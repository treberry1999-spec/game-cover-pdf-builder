name: Probe Google Books VIBE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'magazines/probe_google_vibe.py'
      - '.github/workflows/probe_google_vibe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python magazines/probe_google_vibe.py > google_vibe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: google-vibe-probe
          path: google_vibe.txt
          retention-days: 3
